<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Appointment App password using OTP verification.">
    <title>Forgot Password — Appointment App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>📅 AppointEase</h1>
                <p>Reset your password</p>
            </div>

            <!-- Step Indicators -->
            <div class="steps">
                <div class="step active" id="step1Indicator"></div>
                <div class="step" id="step2Indicator"></div>
                <div class="step" id="step3Indicator"></div>
            </div>

            <!-- Step 1: Enter Email -->
            <div id="step1">
                <form id="emailForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <p class="text-sm text-muted mb-4">We'll send a 6-digit OTP to your email.</p>
                    <button type="submit" class="btn btn-primary btn-block" id="sendOtpBtn">
                        Send OTP
                    </button>
                </form>
            </div>

            <!-- Step 2: Enter OTP -->
            <div id="step2" class="hidden">
                <p class="text-center mb-4" style="color: var(--text-secondary);">
                    Enter the 6-digit code sent to <strong id="sentToEmail"></strong>
                </p>
                <form id="otpForm">
                    <div class="otp-input-group">
                        <input type="text" maxlength="1" class="otp-digit" data-index="0" autofocus>
                        <input type="text" maxlength="1" class="otp-digit" data-index="1">
                        <input type="text" maxlength="1" class="otp-digit" data-index="2">
                        <input type="text" maxlength="1" class="otp-digit" data-index="3">
                        <input type="text" maxlength="1" class="otp-digit" data-index="4">
                        <input type="text" maxlength="1" class="otp-digit" data-index="5">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="verifyOtpBtn">
                        Verify OTP
                    </button>
                </form>
                <div class="auth-links">
                    <a href="#" id="resendOtp">Resend OTP</a>
                </div>
            </div>

            <!-- Step 3: New Password -->
            <div id="step3" class="hidden">
                <form id="newPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm Password</label>
                        <input type="password" id="confirmNewPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
                        Reset Password
                    </button>
                </form>
            </div>

            <div class="auth-links" style="margin-top: 32px;">
                <a href="/login.html">← Back to Sign In</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { authAPI, showToast } from '/js/api.js';

        let userEmail = '';
        let otpValue = '';

        // --- Step Navigation ---
        const showStep = (stepNum) => {
            document.getElementById('step1').classList.toggle('hidden', stepNum !== 1);
            document.getElementById('step2').classList.toggle('hidden', stepNum !== 2);
            document.getElementById('step3').classList.toggle('hidden', stepNum !== 3);

            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById(`step${i}Indicator`);
                el.classList.remove('active', 'done');
                if (i < stepNum) el.classList.add('done');
                if (i === stepNum) el.classList.add('active');
            }
        };

        // --- Step 1: Send OTP ---
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sendOtpBtn');
            userEmail = document.getElementById('email').value.trim();

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending...';

            try {
                await authAPI.forgotPassword(userEmail);
                showToast('OTP sent to your email!', 'success');
                document.getElementById('sentToEmail').textContent = userEmail;
                showStep(2);
                // Focus first OTP input
                document.querySelector('.otp-digit[data-index="0"]').focus();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send OTP';
            }
        });

        // --- OTP Input Auto-advance ---
        const otpInputs = document.querySelectorAll('.otp-digit');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && index < 5) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // Allow paste of full OTP
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                for (let i = 0; i < pasted.length; i++) {
                    if (otpInputs[i]) {
                        otpInputs[i].value = pasted[i];
                    }
                }
                if (pasted.length === 6) {
                    otpInputs[5].focus();
                }
            });
        });

        // --- Step 2: Verify OTP (move to step 3) ---
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            otpValue = Array.from(otpInputs).map(i => i.value).join('');

            if (otpValue.length !== 6) {
                showToast('Please enter all 6 digits', 'error');
                return;
            }

            showToast('OTP verified. Set your new password.', 'success');
            showStep(3);
        });

        // --- Resend OTP ---
        document.getElementById('resendOtp').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await authAPI.forgotPassword(userEmail);
                showToast('New OTP sent!', 'success');
                otpInputs.forEach(i => i.value = '');
                otpInputs[0].focus();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // --- Step 3: Reset Password ---
        document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Resetting...';

            try {
                await authAPI.resetPasswordOTP({
                    email: userEmail,
                    otp: otpValue,
                    newPassword,
                });
                showToast('Password reset successfully! Redirecting...', 'success');
                setTimeout(() => window.location.href = '/login.html', 1500);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
